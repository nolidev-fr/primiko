# Local test site for the plugin. Nothing here ships in the package.
# Start: docker compose -f dev/docker-compose.yml up -d
# Site: http://localhost:8095 (admin / admin), emails: http://localhost:8027
# WP-CLI: docker exec -u 1000 primiko-wp wp <command>
services:
  db:
    image: mariadb:10
    container_name: primiko-db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    volumes:
      - primiko_db:/var/lib/mysql

  wordpress:
    image: wordpress:php8.3-apache
    container_name: primiko-wp
    depends_on:
      - db
    ports:
      - "127.0.0.1:8095:80"
    environment:
      APACHE_RUN_USER: "#1000"
      APACHE_RUN_GROUP: "#1000"
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'FS_METHOD', 'direct' );
    volumes:
      - primiko_wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/primiko
      - ./wp-cli.phar:/usr/local/bin/wp:ro
      - ./mailpit.php:/var/www/html/wp-content/mu-plugins/mailpit.php:ro

  # Catches every email sent by the site.
  mailpit:
    image: axllent/mailpit
    container_name: primiko-mail
    ports:
      - "127.0.0.1:8027:8025"

volumes:
  primiko_db:
  primiko_wp:
