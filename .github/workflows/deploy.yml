name: Deploy to WordPress.org

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  deploy:
    name: Push the tag to the plugin directory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches the plugin version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          header="$(sed -n 's/^ \* Version:[[:space:]]*//p' primiko.php)"
          constant="$(sed -n "s/^define( 'PRIMIKO_VERSION', '\(.*\)' );$/\1/p" primiko.php)"
          stable="$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt)"
          echo "tag=$tag header=$header constant=$constant stable=$stable"
          [ "$tag" = "$header" ] && [ "$tag" = "$constant" ] && [ "$tag" = "$stable" ]
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Build the block
        run: |
          npm ci
          npm run build
      - name: Deploy to the SVN repository
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: primiko
